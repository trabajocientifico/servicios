 {intro:'Este tema es el centro práctico del nodo. Se ocupa de lo que ocurre cuando se pide a la IA una operación de análisis y de cómo convertir esa petición en un procedimiento que pueda revisarse. La dificultad no está en obtener una respuesta —la herramienta siempre entrega una—, sino en saber si corresponde a los datos y al método.',

 {intro:'Un análisis riguroso es el que otra persona puede examinar. Cuando interviene la IA, esa exigencia se vuelve más difícil de cumplir, porque parte del proceso ocurre en una conversación que no queda registrada si no se decide guardarla, y también más necesaria, porque sin registro no es posible saber qué hizo la herramienta y qué decidió quien investiga.',

S.instrOpen=false;let instrEl=null,instrBehind=null;

// El recurso puede tomar el foco dentro de su marco al cargar: mientras la nube está abierta, vuelve a “Empezar”.
function instrFocus(){instrEl?.querySelector('.instr-go')?.focus({preventScroll:true})}
window.addEventListener('blur',()=>{if(instrEl)setTimeout(instrFocus,0)});
document.addEventListener('focusin',e=>{if(instrEl&&!instrEl.contains(e.target))instrFocus()});
// Teclado: Esc o Enter cierran; Tab se queda en el botón. Se intercepta antes que la navegación del curso.
window.addEventListener('keydown',e=>{if(!instrEl)return;if(['Escape','Enter',' '].includes(e.key)){e.preventDefault();e.stopImmediatePropagation();closeInstructions();return}if(e.key==='Tab'){e.preventDefault();instrFocus()}else if(['ArrowRight','ArrowLeft'].includes(e.key)){e.preventDefault();e.stopImmediatePropagation()}},true);
// Volver al catálogo o a la portada cierra la nube.
const instrSuspend=suspendResource;suspendResource=function(){closeInstructions();instrSuspend()};

// Avance del curso, común a los nodos CriterIA (F2 e I3, 18 nov 2026): porcentaje sobre los recursos disponibles,
// registro con fechas, “Mi avance” y “Continuar donde ibas”. Guarda en la plataforma por SCORM (1.2 o 2004; en Open edX,
// el SCORM XBlock) y, sin plataforma, en este navegador. No sabe de ningún motor: cada nodo le pasa un adaptador (cfg):
//  key, curso, prefijo, accents       · identificación y colores por tema
//  level(id) → 0|1|2                  · estado del recurso según el motor (por iniciar, en progreso, finalizado)
//  restore(id,n)                      · opcional: devuelve lo guardado al estado del motor
//  currentLoc() → {r}|{l,t,s}|null    · dónde está la persona (recurso abierto o nivel del catálogo)
//  locate(id) → {topic,code,slot}     · ubicación de un recurso en el catálogo
//  isCover(), prepareStart(actions), setNext(texto), start()
//  openPanel(título,html), closePanel(), notify(texto), onReset(), rerender()
//  install(api)                       · envuelve las funciones del motor y llama a api.refresh() y api.track()
// Usa del motor: S, TOPICS, RESOURCES, SLOTS, icon(), announce(), main, modal, openResource(), showCatalog().
function CriteriaAvance(cfg){
 const KEY=cfg.key,ACCENTS=cfg.accents,LEVELS=['welcome','value','topics','subtopics','resources'];
 const FIELDS={
  '1.2':{suspend:'cmi.suspend_data',location:'cmi.core.lesson_location',status:'cmi.core.lesson_status',exit:'cmi.core.exit',raw:'cmi.core.score.raw',min:'cmi.core.score.min',max:'cmi.core.score.max',time:'cmi.core.session_time'},
  '2004':{suspend:'cmi.suspend_data',location:'cmi.location',status:'cmi.completion_status',exit:'cmi.exit',raw:'cmi.score.raw',min:'cmi.score.min',max:'cmi.score.max',time:'cmi.session_time',scaled:'cmi.score.scaled',progress:'cmi.progress_measure'}
 };
 let api=null,ver=null,mode='none',data={v:1,r:{},loc:null},saved='',savedLoc='',savedScore=-1,commitTimer=0,since=Date.now(),finished=false,ready=false,quiet=false;
 // ── Plataforma (SCORM) o navegador ──
 function search(name){
  const look=start=>{let w=start;for(let n=0;w&&n<12;n++){try{if(w[name])return w[name]}catch(e){}if(w.parent===w)break;w=w.parent}return null};
  return look(window)||(window.opener?look(window.opener):null);
 }
 const F=()=>FIELDS[ver];
 function get(k){try{return String(ver==='1.2'?api.LMSGetValue(k):api.GetValue(k))}catch(e){return ''}}
 function set(k,v){try{return String(ver==='1.2'?api.LMSSetValue(k,String(v)):api.SetValue(k,String(v)))==='true'}catch(e){return false}}
 function commit(){clearTimeout(commitTimer);commitTimer=0;if(mode!=='scorm'||finished)return;try{ver==='1.2'?api.LMSCommit(''):api.Commit('')}catch(e){}}
 function commitSoon(){if(!commitTimer)commitTimer=setTimeout(commit,3000)}
 function localGet(){try{return localStorage.getItem(KEY)}catch(e){return null}}
 function localSet(v){try{localStorage.setItem(KEY,v);return true}catch(e){return false}}
 function localWorks(){try{localStorage.setItem(KEY+'-prueba','1');localStorage.removeItem(KEY+'-prueba');return true}catch(e){return false}}
 function parse(raw){try{const d=JSON.parse(raw);if(d&&d.v===1&&d.r&&typeof d.r==='object')return {v:1,r:d.r,loc:d.loc||null}}catch(e){}return null}
 function connect(){
  const a12=search('API'),a04=a12?null:search('API_1484_11');
  try{if(a12&&String(a12.LMSInitialize(''))==='true'){api=a12;ver='1.2'}else if(a04&&String(a04.Initialize(''))==='true'){api=a04;ver='2004'}}catch(e){api=null}
  if(api){
   mode='scorm';finished=false;since=Date.now();
   data=parse(get(F().suspend))||data;saved=JSON.stringify(data);savedLoc=get(F().location);
   const st=get(F().status);if(!st||['not attempted','unknown'].includes(st))set(F().status,'incomplete');
   set(F().exit,'suspend');set(F().min,0);set(F().max,100);commit();
  }else{mode=localWorks()?'local':'none';data=parse(localGet())||data;saved=JSON.stringify(data)}
 }
 function timespan(ms){const s=Math.round(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),r=s%60;
  return ver==='1.2'?`${String(h).padStart(4,'0')}:${String(m).padStart(2,'0')}:${String(r).padStart(2,'0')}`:`PT${h}H${m}M${r}S`}
 function finish(){
  if(mode!=='scorm'||finished)return;set(F().time,timespan(Date.now()-since));set(F().exit,'suspend');commit();
  try{ver==='1.2'?api.LMSFinish(''):api.Terminate('')}catch(e){}finished=true;
 }
 // ── Recursos disponibles y porcentaje ──
 function available(t){return (t?[t]:TOPICS).flatMap(x=>x.subtopics.flatMap(s=>s.resources.filter(id=>id&&RESOURCES.some(r=>r.id===id))))}
 function level(id){return data.r[id]?data.r[id][0]:0}
 function counts(t){const ids=available(t),done=ids.filter(id=>level(id)===2).length,prog=ids.filter(id=>level(id)===1).length;return {total:ids.length,done,prog,pct:ids.length?Math.round(done/ids.length*100):0}}
 function save(){
  const txt=JSON.stringify(data),pct=counts().pct;
  if(mode==='scorm'&&!finished){
   let dirty=false;
   if(txt!==saved){set(F().suspend,txt);saved=txt;dirty=true}
   const loc=locString();if(loc&&loc!==savedLoc){set(F().location,loc);savedLoc=loc;dirty=true}
   if(pct!==savedScore){set(F().raw,pct);if(ver==='2004'){set(F().scaled,(pct/100).toFixed(2));set(F().progress,(pct/100).toFixed(2))}if(pct===100)set(F().status,'completed');savedScore=pct;dirty=true}
   if(dirty)commitSoon();
  }else if(mode==='local'&&txt!==saved){if(localSet(txt))saved=txt}
 }
 // ── Ubicación ──
 function locString(){const l=data.loc;if(!l)return '';return l.r?`recurso:${l.r}`:`${l.l}:${l.t+1}.${l.s+1}`}
 function validLoc(l){if(!l)return false;if(l.r)return Boolean(available().includes(l.r)&&cfg.locate(l.r));return LEVELS.includes(l.l)&&Boolean(TOPICS[l.t]?.subtopics[l.s])}
 function locLabel(l){
  if(!validLoc(l))return '';
  if(l.r){const loc=cfg.locate(l.r),r=RESOURCES.find(x=>x.id===l.r);return `Tema ${loc.topic} · Subtema ${loc.code} · ${r.title}`}
  if(l.l==='welcome')return 'Bienvenida';
  if(l.l==='value')return 'Lo que te ofrece este curso';
  if(l.l==='topics')return 'Los cuatro temas';
  const t=TOPICS[l.t];if(l.l==='subtopics')return `Tema ${t.number} · ${t.title}`;
  return `Tema ${t.number} · Subtema ${t.number}.${t.subtopics[l.s].number} · ${t.subtopics[l.s].title}`;
 }
 function canResume(){return validLoc(data.loc)}
 function resume(){const l=data.loc;if(!validLoc(l))return;if(l.r){openResource(l.r);return}showCatalog(l.l,{topic:l.t,subtopic:l.s})}
 // ── Registro: el estado del motor se anota con fecha y nunca baja ──
 function track(){
  if(!ready)return;const now=Math.round(Date.now()/1000),before=counts().pct;
  for(const id of available()){
   const n=cfg.level(id);if(!n)continue;
   const rec=data.r[id];if(!rec)data.r[id]=[n,now,n===2?now:0];else if(n>rec[0]){rec[0]=n;if(n===2)rec[2]=now}
  }
  const loc=quiet?null:cfg.currentLoc();if(loc)data.loc=loc;
  save();updateChip();
  const after=counts().pct;if(after===100&&before<100)cfg.notify(`Completaste los ${counts().total} recursos disponibles de este curso.`);
 }
 // ── Interfaz ──
 // Botones propios (data-progress): los botones de los motores llevan data-action, que también escuchan los motores.
 function btn(html,action,secondary=false){return `<button type="button" class="pill compact${secondary?' secondary':''}" data-progress="${action}">${html}</button>`}
 function ring(p,cls=''){return `<span class="avance-ring ${cls}" style="--p:${p}" aria-hidden="true"><b>${p}<small> %</small></b></span>`}
 function bar(p,accent){return `<span class="avance-bar" style="--bar:${accent}" aria-hidden="true"><i style="width:${p}%"></i></span>`}
 function updateChip(){
  const b=document.getElementById('avance');if(!b)return;const c=counts();
  b.style.setProperty('--p',c.pct);b.querySelector('b').innerHTML=`${c.pct}<small> %</small>`;
  const t=`Mi avance: ${c.pct} %, ${c.done} de ${c.total} recursos finalizados`;b.setAttribute('aria-label',t);b.title=t;
 }
 function decorate(){
  const c=counts();
  if(cfg.isCover()){
   const stack=main.querySelector('.cover .stack'),actions=stack?.querySelector('.actions');
   if(actions&&(c.done||c.prog||canResume())){
    actions.insertAdjacentHTML('beforebegin',`<div class="resume-card">${ring(c.pct,'big')}<div class="resume-copy"><p class="resume-kicker">Tu avance</p><p class="resume-count"><b>${c.done} de ${c.total}</b> recursos finalizados${c.prog?` · ${c.prog} en progreso`:''}</p>${canResume()?`<p class="resume-where">${locLabel(data.loc)}</p>`:''}</div></div>`);
    if(canResume()){
     cfg.prepareStart(actions);
     actions.insertAdjacentHTML('afterbegin',`<button class="pill" data-progress="resume">Continuar donde ibas ${icon('arrow')}</button>`);
     cfg.setNext('Continuar donde ibas');
    }
   }
  }
  if(S.scene===1&&S.catalogLevel==='topics')main.querySelectorAll('.topic-portal[data-index]').forEach(p=>{
   const i=Number(p.dataset.index),k=counts(TOPICS[i]),open=p.querySelector('.portal-open');if(!open||!k.total)return;
   open.insertAdjacentHTML('beforebegin',`<span class="portal-avance">${bar(k.pct,ACCENTS[i])}<span>${k.done} de ${k.total} recurso${k.total>1?'s':''} finalizado${k.total>1?'s':''}</span></span>`);
  });
  if(S.scene===1&&S.catalogLevel==='subtopics')main.querySelectorAll('.subtopic-choice[data-index]').forEach(b=>{
   const s=TOPICS[S.topic].subtopics[Number(b.dataset.index)],ids=s.resources.filter(Boolean);if(!ids.length)return;
   const d=ids.filter(id=>level(id)===2).length;b.querySelector('.subtopic-choice-copy')?.insertAdjacentHTML('beforeend',`<span class="subtopic-avance">${icon(d===ids.length?'check':d?'partial':'circle')}${d} de ${ids.length} finalizado${ids.length>1?'s':''}</span>`);
  });
 }
 function refresh(){try{decorate();track()}catch(e){console.error(e)}}
 function date(ts){return ts?new Date(ts*1000).toLocaleString('es-CO',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}):''}
 const LABEL={2:['done','check','Finalizado'],1:['progress','partial','En progreso'],0:['','circle','Por iniciar']};
 function where(){return mode==='scorm'?'Tu avance se guarda en la plataforma del curso, asociado a tu usuario: lo encuentras igual desde cualquier equipo.':mode==='local'?'Tu avance se guarda solo en este navegador y en este equipo. Si cambias de equipo o de navegador, o borras los datos de navegación, empieza de cero.':'Este navegador no permite guardar datos: tu avance se conserva solo mientras la página esté abierta.'}
 function panel(){
  const c=counts();
  return `<div class="avance-panel"><div class="avance-head">${ring(c.pct,'big')}<div class="avance-sum"><p class="avance-big">${c.done} de ${c.total} recursos finalizados</p><p>${c.prog} en progreso · ${c.total-c.done-c.prog} por iniciar</p><p class="small">El porcentaje se calcula sobre los ${c.total} recursos disponibles; los espacios por incorporar no cuentan.</p>${canResume()?`<div class="avance-resume"><button class="pill" data-progress="resume">Continuar donde ibas ${icon('arrow')}</button><span class="small">${locLabel(data.loc)}</span></div>`:''}</div></div>
  ${TOPICS.map((t,i)=>{const k=counts(t);if(!k.total)return '';return `<section class="avance-topic" style="--topic-accent:${ACCENTS[i]}"><div class="avance-topic-head"><h3>Tema ${t.number} · ${t.title}</h3><span>${k.done} de ${k.total}</span></div>${bar(k.pct,ACCENTS[i])}<ul>${available(t).map(id=>{const r=RESOURCES.find(x=>x.id===id),loc=cfg.locate(id),rec=data.r[id],st=LABEL[level(id)];return `<li><span class="badge ${st[0]}">${icon(st[1])}${st[2]}</span><span class="avance-item"><button class="link-button" data-progress="open" data-id="${id}">${r.title}</button><span class="small">${loc.code} · ${SLOTS[loc.slot]}${rec?` · Inicio: ${date(rec[1])}`:''}${rec&&rec[2]?` · Fin: ${date(rec[2])}`:''}</span></span></li>`}).join('')}</ul></section>`}).join('')}
  <div class="avance-actions">${btn(icon('download')+'Descargar mi registro (.txt)','download',true)}${mode==='local'?btn('Borrar mi avance','reset',true):''}</div>
  <div class="avance-confirm" id="avance-confirm" hidden role="group" aria-labelledby="avance-confirm-text"><p id="avance-confirm-text"><b>¿Borrar tu avance?</b> Se pierden el porcentaje, las fechas y el punto donde ibas, guardados en este navegador.</p><div class="actions">${btn('Sí, borrar mi avance','reset-yes')}${btn('Cancelar','reset-no',true)}</div></div>
  <p class="small avance-where">${where()}</p></div>`;
 }
 function openPanel(){cfg.openPanel('Mi avance',panel())}
 function registro(){
  const c=counts(),lines=[`Registro de avance · ${cfg.curso} · CriterIA`,`Generado: ${date(Math.round(Date.now()/1000))}`,`Avance: ${c.pct} % (${c.done} de ${c.total} recursos finalizados; ${c.prog} en progreso)`,where(),''];
  if(canResume())lines.push(`Donde ibas: ${locLabel(data.loc)}`,'');
  for(const t of TOPICS){const ids=available(t);if(!ids.length)continue;lines.push(`Tema ${t.number} · ${t.title}`);
   for(const id of ids){const r=RESOURCES.find(x=>x.id===id),loc=cfg.locate(id),rec=data.r[id];lines.push(`  ${LABEL[level(id)][2]} · ${loc.code} ${SLOTS[loc.slot]} · ${r.title}${rec?` · inicio ${date(rec[1])}`:''}${rec&&rec[2]?` · fin ${date(rec[2])}`:''}`)}
   lines.push('')}
  return lines.join('\r\n');
 }
 function download(){
  const a=document.createElement('a'),d=new Date(),f=`avance_${cfg.prefijo}_${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}.txt`;
  a.href=URL.createObjectURL(new Blob(['﻿'+registro()],{type:'text/plain;charset=utf-8'}));a.download=f;document.body.append(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);announce('Registro descargado.');
 }
 function reset(){
  data={v:1,r:{},loc:null};cfg.onReset();
  try{localStorage.removeItem(KEY)}catch(e){}saved=JSON.stringify(data);
  // Al volver a pintar no se anota la pantalla actual: tras borrar no queda nada guardado hasta la siguiente navegación.
  quiet=true;cfg.closePanel();cfg.rerender();quiet=false;updateChip();announce('Tu avance quedó en cero.');
 }
 // ── Instalación ──
 function install(){
  connect();
  if(typeof PATHS==='object'&&!PATHS.download)PATHS.download='M12 3v12m-5-5 5 5 5-5M4 17v4h16v-4';
  if(cfg.restore)for(const id of available())if(level(id))cfg.restore(id,level(id));
  cfg.install({refresh,track,canResume,resume,stored:level,LABEL});
  const header=document.querySelector('header .header-actions');
  header?.insertAdjacentHTML('afterbegin',`<button class="circle avance-chip" id="avance" type="button"><b></b></button>`);
  document.getElementById('avance')?.addEventListener('click',openPanel);
  document.addEventListener('click',e=>{
   const b=e.target.closest('[data-progress]');if(!b)return;const a=b.dataset.progress;
   if(a==='resume'){if(modal.open)cfg.closePanel();resume()}
   if(a==='start'&&cfg.start)cfg.start();
   if(a==='open'){cfg.closePanel();openResource(b.dataset.id)}
   if(a==='download')download();
   if(a==='reset'){const c=document.getElementById('avance-confirm');c.hidden=false;c.querySelector('[data-progress=reset-no]').focus()}
   if(a==='reset-no'){document.getElementById('avance-confirm').hidden=true;modal.querySelector('[data-progress=reset]')?.focus()}
   if(a==='reset-yes')reset();
  });
  document.addEventListener('visibilitychange',()=>{if(document.hidden)commit()});
  window.addEventListener('pagehide',finish);
  window.addEventListener('pageshow',e=>{if(e.persisted&&mode==='scorm'){connect();cfg.rerender()}});
  ready=true;cfg.rerender();updateChip();
  if(mode==='scorm' && get(ver==='1.2'?'cmi.core.entry':'cmi.entry')==='resume'){
   if(!canResume()){
    const ultimoCambio=id=>Math.max(data.r[id][1]||0,data.r[id][2]||0);
    const recientes=available().filter(id=>level(id)).sort((a,b)=>ultimoCambio(b)-ultimoCambio(a));
    if(recientes.length)data.loc={r:recientes[0]};
   }
   resume();
  }
 }
 document.readyState==='loading'?document.addEventListener('DOMContentLoaded',install):install();
 return {counts,get mode(){return mode},get data(){return data},resume,openPanel,registro,track};
}

// Adaptador del avance para los nodos de Investigación (I2 e I3, 18 nov 2026): los dos usan el mismo motor de catálogo
// (tmp/i2-criteria/engine.js y tmp/i3-criteria/engine.js) y solo cambian textos, colores y el canal de mensajes.
// El estado de cada recurso son dos conjuntos de ids (S.visited y S.completed) que lee card(): lo guardado se devuelve
// a ellos al cargar. Envuelve render y openResource; el botón “Seguir” del pie se atiende en captura porque el motor lo
// registró con la referencia a next(). El núcleo (avance.js) se instala en DOMContentLoaded, después del arranque del motor.
function CriteriaAvanceInvestigacion(o){
 return CriteriaAvance({
  key:o.key,curso:o.curso,prefijo:o.prefijo,accents:o.accents,
  level(id){return S.completed.has(id)?2:S.visited.has(id)?1:0},
  restore(id,n){S.visited.add(id);if(n===2)S.completed.add(id)},
  currentLoc(){
   if(S.resource)return {r:S.resource};
   if(S.scene===1&&['welcome','value','topics','subtopics','resources'].includes(S.catalogLevel))return {l:S.catalogLevel,t:S.topic,s:S.subtopic};
   return null;
  },
  locate(id){const l=locate(id);return l&&{topic:l.t.number,code:`${l.t.number}.${l.sub.number}`,slot:l.slot}},
  isCover(){return S.scene===0&&!S.resource},
  // “Comenzar” (data-action="start") ya lleva a la bienvenida: solo cambia su texto y pasa a secundario.
  prepareStart(actions){const b=actions.querySelector('[data-action=start]');if(b){b.classList.add('secondary');b.textContent='Empezar desde la bienvenida'}},
  setNext(t){buttonLabel('next',t)},
  openPanel(title,html){openModal(title,html);modal.classList.add('wide');modal.addEventListener('close',()=>modal.classList.remove('wide'),{once:true})},
  closePanel(){if(modal.open)modal.close()},
  notify(t){announce(t)},
  onReset(){S.completed.clear();S.visited.clear()},
  // Con un recurso abierto (p. ej. una ruta #rXX al cargar) no se vuelve a pintar, para no moverle el foco.
  rerender(){if(!S.resource)render(false)},
  install(api){
   const baseRender=render;render=function(...a){baseRender.apply(this,a);api.refresh()};
   const baseOpen=openResource;openResource=function(id){baseOpen(id);api.track()};
   // En la portada, “Seguir” continúa donde iba; si no hay dónde, sigue a la bienvenida como siempre.
   document.addEventListener('click',e=>{if(!e.target.closest('#next')||S.scene!==0||S.resource||!api.canResume())return;e.preventDefault();e.stopImmediatePropagation();api.resume()},true);
   // Los recursos avisan al terminar; el motor ya anotó el “complete” en S.completed antes que este oyente.
   window.addEventListener('message',e=>{if(e.data?.channel===o.canal&&e.data.type==='complete')api.track()});
  }
 });
}

// Avance de I2 (18 nov 2026): el núcleo común ../avance/avance.js con el adaptador de Investigación
// (../avance/investigacion.js), que comparte con I3. Aquí solo van los datos del nodo; acentos de I2: azul, coral, violeta, rosa.
const Avance=CriteriaAvanceInvestigacion({
 key:'criteria-i2-avance',curso:'Método, datos y análisis con IA (Nodo I2)',prefijo:'I2',
 accents:['#2BA6CB','#FF796F','#6E3CFA','#E28DC1'],canal:'criteria-i2-resource'
});

// Fila deslizable de recursos (≤640 px): los puntos siguen la tarjeta visible y llevan a cada una.
(()=>{
 const dotsFor=row=>row.parentElement&&row.parentElement.querySelector(':scope>.slot-dots');
 function sync(row){
  const dots=dotsFor(row);if(!dots)return;
  const cards=[...row.children],base=row.getBoundingClientRect().left;let best=0,dist=Infinity;
  cards.forEach((c,i)=>{const d=Math.abs(c.getBoundingClientRect().left-base);if(d<dist){dist=d;best=i}});
  if(row.scrollLeft+row.clientWidth>=row.scrollWidth-4)best=cards.length-1;
  [...dots.children].forEach((d,i)=>d.classList.toggle('on',i===best));
 }
 let frame=0;
 document.addEventListener('scroll',e=>{
  const row=e.target;if(!(row instanceof Element)||!row.matches('.resource-explorer>.curriculum-slots'))return;
  cancelAnimationFrame(frame);frame=requestAnimationFrame(()=>sync(row));
 },true);
 document.addEventListener('click',e=>{
  const dot=e.target instanceof Element&&e.target.closest('.slot-dots>i');if(!dot)return;
  const row=dot.parentElement.parentElement.querySelector(':scope>.curriculum-slots');
  const card=row&&row.children[[...dot.parentElement.children].indexOf(dot)];
  if(card)row.scrollBy({left:card.getBoundingClientRect().left-row.getBoundingClientRect().left-2,behavior:document.body.classList.contains('reduced')?'auto':'smooth'});
 });
})();

    const li = document.createElement('li'), fila = document.createElement('div');
    const boton = document.createElement('button');
    const item = {clave, titulo, boton, li, padre, ruta};
    elementos.set(clave, item);
    if (grupo) li.className = 'indice-grupo';
    fila.className = 'indice-fila';
    boton.type = 'button';
    boton.className = 'indice-destino';
    boton.dataset.indice = clave;
    if (codigo) {
      const prefijo = document.createElement('span');
      prefijo.className = 'indice-codigo';
      prefijo.textContent = codigo;
      boton.append(prefijo);
    }
    const etiqueta = document.createElement('span');
    etiqueta.textContent = titulo;
    boton.append(etiqueta);
    boton.addEventListener('click', () => {
      if (dialogo.open) mostrar(false, false);
      navegar();
    });
    fila.append(boton);
    li.append(fila);
    if (rama) {
      item.rama = document.createElement('ul');
      item.rama.id = 'indice-lista-' + clave;
      item.flecha = document.createElement('button');
      item.flecha.type = 'button';
      item.flecha.className = 'indice-flecha';
      item.flecha.setAttribute('aria-controls', item.rama.id);
      item.flecha.addEventListener('click', () => desplegar(item, item.rama.hidden));
      fila.append(item.flecha);
      li.append(item.rama);
      desplegar(item, false);
    }
    (padre ? padre.rama : lista).append(li);
    return item;
  }
  agregar('portada', 'Portada', () => home());
  agregar('welcome', 'Bienvenida', () => showCatalog('welcome'));
  agregar('value', 'Lo que te ofrece este curso', () => showCatalog('value'));
  agregar('topics', 'Mapa de temas', () => showCatalog('topics'));
  TOPICS.forEach((tema, i) => {
    const n = String(tema.number), claveTema = 't' + n;
    const temaItem = agregar(claveTema, tema.title, () => showCatalog('subtopics', {topic:i}), {
      codigo:n, rama:true, grupo:i === 0, ruta:'Tema ' + n
    });
    tema.subtopics.forEach((sub, j) => {
      const codigo = n + '.' + sub.number, ruta = 'Tema ' + n + ' · Subtema ' + codigo;
      const subItem = agregar('s' + codigo, sub.title, () => showCatalog('resources', {topic:i, subtopic:j}), {
        padre:temaItem, codigo, rama:sub.resources.some(Boolean), ruta
      });
      sub.resources.forEach((id, k) => {
        const recurso = id && RESOURCES.find(r => r.id === id);
        if (recurso) agregar(id, recurso.title, () => openResource(id), {
          padre:subItem, ruta:ruta + ' · ' + SLOTS[k]
        });
      });
    });
  });


  function ubicacion() {
    if (S.resource) return S.resource;
    if (S.scene === 0) return 'portada';
    const tema = TOPICS[S.topic];
    if (S.catalogLevel === 'subtopics') return 't' + tema.number;
    if (S.catalogLevel === 'resources') return 's' + tema.number + '.' + tema.subtopics[S.subtopic].number;
    return S.catalogLevel;
  }
  function enfocarEnLista() {
    requestAnimationFrame(() => {
      if (!elegido || !dialogo.open) return;
      let visible = elegido;
      while (visible.padre && !visible.boton.getClientRects().length) visible = visible.padre;
      const destino = visible.boton.getBoundingClientRect(), borde = nav.getBoundingClientRect();
      if (destino.top < borde.top) nav.scrollTop += destino.top - borde.top - 4;
      else if (destino.bottom > borde.bottom) nav.scrollTop += destino.bottom - borde.bottom + 4;
    });
  }
  function actualizar() {
    const item = elementos.get(ubicacion());
    if (!item || elegido === item) return;
    elegido?.boton.removeAttribute('aria-current');
    for (let p = elegido?.padre; p; p = p.padre) p.li.classList.remove('indice-antecesor');
    elegido = item;
    if (item.rama) desplegar(item, true);
    for (let p = item.padre; p; p = p.padre) {
      p.li.classList.add('indice-antecesor');
      desplegar(p, true);
    }
    item.boton.setAttribute('aria-current', 'location');
    el('actual').textContent = item.titulo;
    el('ruta').textContent = item.ruta;
    el('ruta').hidden = !item.ruta;
    abrir.title = 'Abrir índice del curso. Estás en ' + [item.ruta, item.titulo].filter(Boolean).join(' · ');
    abrir.setAttribute('aria-label', abrir.title);
    enfocarEnLista();
  }
  function mostrar(visible, foco = true) {
    if (visible === dialogo.open) return;
    if (visible) dialogo.showModal();
    else dialogo.close();
    document.body.classList.toggle('indice-modal', visible);
    abrir.setAttribute('aria-expanded', String(visible));
    if (foco) (visible ? cerrar : abrir).focus({preventScroll:true});
    if (visible) enfocarEnLista();
    sendPrefs();
  }
  abrir.addEventListener('click', () => mostrar(true));
  cerrar.addEventListener('click', () => mostrar(false));
  dialogo.addEventListener('cancel', e => { e.preventDefault(); mostrar(false); });
  dialogo.addEventListener('click', e => { if (e.target === dialogo) mostrar(false); });
  window.addEventListener('keydown', e => {
    if (!dialogo.contains(e.target) && e.target !== abrir) return;
    if (e.key === 'Escape' && dialogo.open) {
      e.preventDefault();
      e.stopImmediatePropagation();
      mostrar(false);
    } else if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Home','End',' '].includes(e.key)) {
      e.stopImmediatePropagation();
    }
  }, true);
  abrir.hidden = false;
  return {actualizar};
})();
</script>

<script id="ox-embebido">
(()=>{
 const m=(location.search||'').match(/[?&]recurso=(r\d\d)/);
 if(!m)return;
 const id=m[1];if(!RESOURCES.find(x=>x.id===id))return;
 document.documentElement.classList.add('ox-embebido');
 let aviso=null;
 function avisar(){if(aviso)return;aviso=document.createElement('div');aviso.className='ox-aviso';aviso.setAttribute('role','status');
  aviso.textContent='Recurso terminado. Continúa con la siguiente unidad del nodo.';document.body.append(aviso);setTimeout(()=>{aviso.remove();aviso=null},4500)}
 const abrirOriginal=openResource;let abierto=false;
 openResource=function(otro){if(abierto&&otro!==id){avisar();return}abierto=true;return abrirOriginal(otro)};
 const previoOriginal=previous;previous=function(){if(abierto){avisar();return}return previoOriginal()};
 const portadaOriginal=home;home=function(){if(abierto){avisar();return}return portadaOriginal()};
 const abrir=()=>{try{openResource(id)}catch(e){console.error('[ox-embebido]',e)}};
 if(document.readyState==='complete')setTimeout(abrir,60);else addEventListener('load',()=>setTimeout(abrir,60));
})();
</script>
